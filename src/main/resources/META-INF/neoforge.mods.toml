modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

issueTrackerURL="https://github.com/Lancet-crow/tameable-foxes/issues"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

displayURL="https://modrinth.com/mod/tameable-foxes"

logoFile="icon.png"

authors="${mod_authors}"

description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fzzy_config"
    type="required"
    versionRange="${fzzy_config_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId="forgified_fabric_api"
type="required"
versionRange="${fabric_range}"
ordering="NONE"
side="BOTH"


modProperties={fzzy_config="mod_id"}


[modproperties.modmenu]
sources="https://github.com/Lancet-crow/tameable-foxes"
contributors=[
    "Fyoncle",
    "Maria"
]